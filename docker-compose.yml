services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.sqlite3
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8080:8080"   # webhook — наружу через nginx (HTTPS)
      - "30000:30000"           # GSI от игроков (CS2 шлёт обычный HTTP)
